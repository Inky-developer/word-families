<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="180" height="180">
	<title>Wortfamilien</title>
	<!-- Source for static/apple-touch-icon.png. iOS applies its own squircle mask and
	     composites transparency to black, so this variant is full-bleed and opaque —
	     unlike icon.svg, whose rounded corners are transparent. The glyph sits at 72%,
	     larger than icon-maskable.svg since iOS crops far less than Android launchers. -->
	<rect width="24" height="24" fill="#15656f" />
	<g transform="translate(12 12) scale(0.72) translate(-12 -12)">
		<g stroke="#fcfbf8" fill="#fcfbf8" stroke-width="1.5" stroke-linecap="round">
			<path d="M12 4.6v6.4m0 0-3.6 4.4m3.6-4.4 3.6 4.4" fill="none" />
			<circle cx="12" cy="4" r="1.7" stroke="none" />
			<circle cx="7.6" cy="17" r="1.7" stroke="none" />
			<circle cx="16.4" cy="17" r="1.7" stroke="none" />
		</g>
	</g>
</svg>
